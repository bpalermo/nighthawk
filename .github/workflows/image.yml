name: Multi-arch image

# Builds optimized Nighthawk binaries natively on amd64 and arm64 GitHub-hosted
# runners (inside the Envoy CI build image, which is itself multi-arch), wraps
# them with ci/docker/Dockerfile-nighthawk-client, pushes one image per
# architecture, and stitches them into a multi-arch manifest:
#
#   ghcr.io/<owner>/nighthawk:<sha>          (every run)
#   ghcr.io/<owner>/nighthawk:latest         (main only)
#
# Optional: set the BUILDBUDDY_API_KEY repository secret to use a BuildBuddy
# remote cache so a build that hits the 6h runner limit can resume on retry.

permissions:
  contents: read

on:
  push:
    branches:
    - main
    - 'p[0-9]-*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/nighthawk

jobs:
  build:
    name: build (${{ matrix.arch }})
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: amd64
          runner: ubuntu-24.04
        - arch: arm64
          runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    steps:
    - uses: actions/checkout@v7.0.1

    - name: Configure repo Bazel settings
      run: |
        echo "common --config=clang" >> repo.bazelrc
        echo "build --remote_download_toplevel" >> repo.bazelrc

    - name: Configure optional remote cache
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        if [[ -n "${BUILDBUDDY_API_KEY}" ]]; then
          {
            echo "build --remote_cache=grpcs://remote.buildbuddy.io"
            echo "build --remote_header=x-buildbuddy-api-key=${BUILDBUDDY_API_KEY}"
            echo "build --remote_cache_compression"
            echo "build --remote_timeout=3600"
            echo "build --experimental_remote_cache_eviction_retries=5"
          } >> repo.bazelrc
          echo "Remote cache enabled."
        else
          echo "BUILDBUDDY_API_KEY not set; building without a remote cache."
        fi

    - name: Bind mount spare disk for build artifacts
      uses: envoyproxy/toolshed/actions/bind-mounts@actions-v0.4.23
      with:
        mounts: |
          - src: /mnt/envoy-docker-build
            target: /tmp/envoy-docker-build
            chown: runner:runner
          - src: /mnt/bazel-shared
            target: /tmp/bazel-shared
            chown: runner:runner

    - name: Build optimized binaries
      run: |
        ./ci/run_envoy_docker.sh './ci/do_ci.sh opt_build && cp -v bazel-bin/nighthawk_client.stripped bazel-bin/nighthawk_test_server.stripped bazel-bin/nighthawk_service.stripped bazel-bin/nighthawk_output_transform.stripped bazel-bin/nighthawk_adaptive_load_client.stripped /build/'
      env:
        NUM_CPUS: 4

    - name: Prepare image build context
      run: |
        set -e
        CTX="${RUNNER_TEMP}/image-context"
        rm -rf "${CTX}" && mkdir -p "${CTX}"
        cp ci/docker/Dockerfile-nighthawk-client ci/docker/default-config.yaml "${CTX}/"
        for b in nighthawk_client nighthawk_test_server nighthawk_service nighthawk_output_transform nighthawk_adaptive_load_client; do
          cp "/tmp/envoy-docker-build/${b}.stripped" "${CTX}/${b}"
        done
        ls -la "${CTX}"
        file "${CTX}/nighthawk_client"
        echo "CTX=${CTX}" >> "$GITHUB_ENV"

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - uses: docker/setup-buildx-action@v3

    - name: Build and push per-arch image
      uses: docker/build-push-action@v6
      with:
        context: ${{ env.CTX }}
        file: ${{ env.CTX }}/Dockerfile-nighthawk-client
        platforms: linux/${{ matrix.arch }}
        push: true
        provenance: false
        tags: ${{ env.IMAGE }}:${{ github.sha }}-${{ matrix.arch }}

    - name: Smoke test
      run: |
        docker run --rm --platform linux/${{ matrix.arch }} \
          ${{ env.IMAGE }}:${{ github.sha }}-${{ matrix.arch }} --version

  manifest:
    needs: build
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    steps:
    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Create multi-arch manifest
      run: |
        set -e
        TAGS=(-t "${IMAGE}:${GITHUB_SHA}")
        if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
          TAGS+=(-t "${IMAGE}:latest")
        fi
        docker buildx imagetools create "${TAGS[@]}" \
          "${IMAGE}:${GITHUB_SHA}-amd64" \
          "${IMAGE}:${GITHUB_SHA}-arm64"
        docker buildx imagetools inspect "${IMAGE}:${GITHUB_SHA}"
